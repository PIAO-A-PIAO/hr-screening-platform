services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://interview:interview@postgres:5432/interview?schema=public
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /app/var/uploads
      DEMO_USER_EMAIL: recruiter@demo.local
    ports:
      - "4000:4000"
    command: >-
      sh -c "npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      && npx tsx packages/database/prisma/seed.ts
      && node apps/api/dist/main.js"
    volumes:
      - uploads:/app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    environment:
      API_URL: http://api:4000/api
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
