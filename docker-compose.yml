services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ds_hr
      POSTGRES_USER: ds_hr
      POSTGRES_PASSWORD: ds_hr
    ports:
      - "5432:5432"
    volumes:
      - foundation_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_hr -d ds_hr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: local
      NODE_ENV: production
      DATABASE_URL: postgresql://ds_hr:ds_hr@postgres:5432/ds_hr?schema=public
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      STORAGE_DIR: /app/var/private-storage
      LOG_LEVEL: log
    ports:
      - "4000:4000"
    volumes:
      - foundation_private_storage:/app/var/private-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:4000/api
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  foundation_db_data:
  foundation_private_storage:
