name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ds_hr
          POSTGRES_USER: ds_hr
          POSTGRES_PASSWORD: ds_hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ds_hr -d ds_hr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: ci
      NODE_ENV: test
      DATABASE_URL: postgresql://ds_hr:ds_hr@localhost:5432/ds_hr?schema=public
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000/api
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      STORAGE_DRIVER: filesystem
      STORAGE_DIR: /tmp/ds-hr-private-storage
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: mkdir -p /tmp/ds-hr-private-storage
      - run: npm run db:deploy
      - run: npm run verify

      - name: Smoke test compiled API and production web
        shell: bash
        run: |
          set -euo pipefail

          node apps/api/dist/main.js > /tmp/ds-hr-api.log 2>&1 &
          api_pid=$!

          npm run start -w @ds-hr/web > /tmp/ds-hr-web.log 2>&1 &
          web_pid=$!

          cleanup() {
            kill "$api_pid" "$web_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4000/api/health/ready > /tmp/readiness.json; then
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/ds-hr-api.log
              exit 1
            fi

            sleep 1
          done

          grep -q '"status":"ready"' /tmp/readiness.json
          curl --fail --silent http://localhost:4000/api/health/live

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000 > /tmp/web.html; then
              exit 0
            fi

            if ! kill -0 "$web_pid" 2>/dev/null; then
              cat /tmp/ds-hr-web.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/ds-hr-web.log
          exit 1

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, linux, x64, ds-hr-staging]
    timeout-minutes: 45

    concurrency:
      group: ds-hr-staging
      cancel-in-progress: false

    env:
      COMPOSE_PARALLEL_LIMIT: 1

    steps:
      - uses: actions/checkout@v5

      - name: Show server resources
        run: |
          free -h
          df -h /

      - name: Build API staging image
        run: >-
          docker compose
          --project-name ds-hr-staging
          --env-file /opt/ds-hr/.env.staging
          -f docker-compose.staging.yml
          build api

      - name: Build web staging image
        run: >-
          docker compose
          --project-name ds-hr-staging
          --env-file /opt/ds-hr/.env.staging
          -f docker-compose.staging.yml
          build web

      - name: Start database
        run: >-
          docker compose
          --project-name ds-hr-staging
          --env-file /opt/ds-hr/.env.staging
          -f docker-compose.staging.yml
          up -d postgres

      - name: Deploy migrations
        run: >-
          docker compose
          --project-name ds-hr-staging
          --env-file /opt/ds-hr/.env.staging
          -f docker-compose.staging.yml
          run --rm api npm run db:deploy

      - name: Start application
        run: >-
          docker compose
          --project-name ds-hr-staging
          --env-file /opt/ds-hr/.env.staging
          -f docker-compose.staging.yml
          up -d --remove-orphans

      - name: Verify staging locally
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost/api/health/ready |
              grep -q '"status":"ready"'; then
              curl --fail --silent http://localhost/ >/dev/null
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Show deployment diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose \
            --project-name ds-hr-staging \
            --env-file /opt/ds-hr/.env.staging \
            -f docker-compose.staging.yml \
            ps

          docker compose \
            --project-name ds-hr-staging \
            --env-file /opt/ds-hr/.env.staging \
            -f docker-compose.staging.yml \
            logs --tail=100

      - name: Remove unused image layers
        if: success()
        run: docker image prune --force